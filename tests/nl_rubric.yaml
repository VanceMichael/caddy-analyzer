---
rubrics:
- id: 1
  type: f2p
  text: 同一状态路径上的跨进程读改写作为完整事务执行；并发新增、删除、重复 block/unban 与不同 IP 批量操作不丢更新，落盘始终是权限正确且可解析的完整状态。
- id: 2
  type: f2p
  text: 运行中 guard 的 debounced save、tick 末保存和 FlushState 会协调手工命令提交后的状态代际，保留外部新增并尊重外部删除，不用启动时或上次保存的旧快照覆盖当前文件。
- id: 3
  type: f2p
  text: 手工 block 在防火墙成功而状态提交失败时尝试解除刚添加的规则并返回非零；补偿也失败时保留并报告两个错误，且不会打印或审计为已收敛成功。
- id: 4
  type: f2p
  text: 手工 unban 在防火墙删除失败时不移除持久状态；防火墙成功而状态更新失败时恢复规则或返回包含恢复结果的失败，unban --all 对任一未收敛项返回非零并继续处理其余项。
- id: 5
  type: f2p
  text: 终端成功输出和本地、syslog、webhook 审计只在最终防火墙与持久状态一致后发布；失败、补偿和部分批量结果不会产生误导性的成功事件。
- id: 6
  type: p2p
  text: 旧版 JSON 数组中的永久与临时条目继续加载，重启仍重建有效规则、清理已过期或受保护地址，并在失败后保留可供下一次到期或保护刷新重试的状态。
- id: 7
  type: f2p
  text: 空 state-file 仍禁用持久化，dry-run 不触碰防火墙或文件；锁定、写入、同步和重命名故障均返回失败并保留此前完整状态，后续健康操作仍可继续。
